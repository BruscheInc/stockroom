<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Brusche Stockroom</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{ --bg:#0b1220; --panel:#121b2e; --panel2:#0e1626; --line:#20304a; --ink:#e8f0ff; --muted:#8ea3c4; --accent:#39d98a; --accent2:#49b6ff; --warn:#ffb454; --bad:#ff6b6b; --mono:ui-monospace,Menlo,Consolas,monospace }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
  body{padding-bottom:76px}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0d1728,#0b1220);border-bottom:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
  header .logo{font-weight:800;letter-spacing:.02em}
  header .logo b{color:var(--accent)}
  header .who{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  header .who input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 8px;width:96px;font-size:12px}
  .wrap{max-width:720px;margin:0 auto;padding:14px 14px 0}
  .scanbar{display:flex;gap:8px;margin-bottom:12px}
  .scanbar input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px 14px;font-size:16px}
  .scanbar input:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--accent);color:#052012;border:none;border-radius:12px;padding:0 16px;font-weight:700;font-size:15px}
  .btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .btn.blue{background:var(--accent2);color:#04121f}
  .btn.ghost{background:transparent;color:var(--accent2);border:1px solid var(--line)}
  .btn:active{transform:translateY(1px)}
  .btn.wide{width:100%;padding:14px;border-radius:12px}
  #reader{width:100%;border-radius:14px;overflow:hidden;margin-bottom:12px;display:none;background:#000}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .muted{color:var(--muted)} .mono{font-family:var(--mono)}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .k{color:var(--muted);font-size:13px} .v{font-weight:600;text-align:right}
  .title{font-size:19px;font-weight:800;line-height:1.2;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.bin{background:rgba(73,182,255,.16);color:var(--accent2);border:1px solid rgba(73,182,255,.35)}
  .pill.nobin{background:rgba(255,180,84,.14);color:var(--warn);border:1px solid rgba(255,180,84,.35)}
  .itemhead{display:flex;gap:14px;align-items:center}
  .itemhead img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--panel2);border:1px solid var(--line)}
  .qtygrid{display:grid;grid-template-columns:1fr auto;gap:0;margin-top:6px}
  .big{font-size:34px;font-weight:800;line-height:1}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .hist{font-size:13px}
  .hist .h{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .hist .h:last-child{border-bottom:none}
  .arrow{color:var(--accent)}
  .sectlabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 2px 6px}
  .moverow{display:flex;gap:8px;margin-top:6px}
  .moverow input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px}
  .note{color:var(--muted);font-size:13px;text-align:center;margin:8px 0}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#08381f;color:#c9ffe4;border:1px solid #1c8a54;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1} .toast.bad{background:#3a1414;color:#ffd4d4;border-color:#8a1c1c}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#0c1626;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{flex:1;background:none;border:none;color:var(--muted);padding:11px 0 12px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.tabs button .i{font-size:19px}
  nav.tabs button.on{color:var(--accent)}
  .binlist a{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
  .binlist a:last-child{border-bottom:none}
  .hidden{display:none!important}
  .center{text-align:center}
  .topbar{position:sticky;top:0;z-index:15;display:flex;justify-content:flex-end;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
  .topbar .btn{padding:9px 20px;border-radius:10px;font-size:14px}
  #refreshBtn.spin{opacity:.6}
  .filters{display:flex;align-items:center;gap:8px;margin:-2px 0 12px;flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex:1;min-width:0}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
  .chip.on{background:rgba(57,217,138,.16);border-color:var(--accent);color:var(--accent)}
  #sort{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px}
  .keyprompt{max-width:420px;margin:14vh auto;padding:0 20px;text-align:center}
  .keyprompt input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px;font-size:16px;margin:12px 0}
  @media print{ body *{visibility:hidden} #printArea,#printArea *{visibility:visible} #printArea{position:absolute;inset:0;padding:24px;color:#000;background:#fff} }
  #printArea{display:none}
</style>
</head>
<body>

<div id="keygate" class="keyprompt hidden">
  <h2>Brusche Stockroom</h2>
  <p class="muted" id="gateMsg">Enter your username to sign in.</p>
  <input id="keyInput" placeholder="username" autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')saveKey()" />
  <button class="btn wide" onclick="saveKey()">Sign in</button>
</div>

<div id="appwrap" class="hidden">
<header>
  <div class="logo">📦 <b>Stockroom</b></div>
  <div class="who">👤 <b id="whoName" style="color:var(--ink)">…</b> <a href="#" onclick="signOut();return false" style="color:var(--muted);margin-left:8px;font-size:12px">sign out</a></div>
</header>
<div class="topbar"><button class="btn blue" id="refreshBtn" onclick="refreshNow()">⟳ Refresh</button></div>

<div class="wrap">
  <!-- SCAN TAB -->
  <section id="tab-scan">
    <div class="scanbar">
      <input id="scan" placeholder="Scan or type SKU / UPC / bin…" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button class="btn" onclick="submitScan()">Go</button>
    </div>
    <button class="btn blue wide" id="camBtn" onclick="toggleCamera()">📷 Scan with camera</button>
    <div id="reader"></div>
    <div class="note" id="scanNote">Point the camera at a barcode or QR, or use a scanner gun into the box above.</div>
    <div id="result"></div>
  </section>

  <!-- BINS TAB -->
  <section id="tab-bins" class="hidden">
    <div class="scanbar">
      <input id="newBin" placeholder="New bin code (e.g. A-01-3)" autocomplete="off" />
      <button class="btn" onclick="addBin()">Add</button>
    </div>
    <button class="btn ghost wide" id="syncBtn" onclick="syncSS()">⟳ Import existing bins from ShipStation</button>
    <div class="sectlabel">Bins</div>
    <div class="binlist card" id="binlist"><div class="muted center">Loading…</div></div>
  </section>

  <!-- SEARCH TAB -->
  <section id="tab-search" class="hidden">
    <div class="scanbar">
      <input id="q" placeholder="Search by name or SKU (e.g. milk chocolate)…" autocomplete="off" oninput="doFind()" />
    </div>
    <div class="filters">
      <div class="chips">
        <button class="chip on" data-st="ACTIVE" onclick="toggleChip(this)">Active</button>
        <button class="chip on" data-st="DRAFT" onclick="toggleChip(this)">Draft</button>
        <button class="chip on" data-st="ARCHIVED" onclick="toggleChip(this)">Inactive</button>
      </div>
      <select id="sort" onchange="renderFind()">
        <option value="qty_desc">Qty: high → low</option>
        <option value="qty_asc">Qty: low → high</option>
        <option value="bin_asc">Bin: low → high</option>
        <option value="bin_desc">Bin: high → low</option>
      </select>
    </div>
    <div id="searchres" class="card"><div class="muted center">Type a product name or SKU to search all stores.</div></div>
  </section>
</div>

<nav class="tabs">
  <button id="nav-scan" class="on" onclick="showTab('scan')"><span class="i">🔍</span>Scan</button>
  <button id="nav-bins" onclick="showTab('bins')"><span class="i">🗄️</span>Bins</button>
  <button id="nav-search" onclick="showTab('search')"><span class="i">📋</span>Items</button>
</nav>
</div>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ---------- key / state ---------- */
const KEY = (function(){ try{ const u=new URLSearchParams(location.search).get("key"); if(u){localStorage.setItem("sk_key",u);return u;} return localStorage.getItem("sk_key")||""; }catch(e){ return ""; } })();
const $ = (id)=>document.getElementById(id);
function saveKey(){ const v=$("keyInput").value.trim(); if(!v)return; try{localStorage.setItem("sk_key",v);}catch(e){} location.href=location.pathname+"?key="+encodeURIComponent(v); }
function signOut(){ try{localStorage.removeItem("sk_key");}catch(e){} location.href=location.pathname; }
let CURRENT_USER="";
function whoName(){ return CURRENT_USER; }
let currentView=null; // {kind:'bin',key} — drives live auto-refresh of shared views
const esc=(s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg,bad){ const t=$("toast"); t.textContent=msg; t.className="toast show"+(bad?" bad":""); clearTimeout(t._t); t._t=setTimeout(()=>t.className="toast",2200); }
async function api(p,opts){ opts=opts||{}; const u=p+(p.includes("?")?"&":"?")+"key="+encodeURIComponent(KEY); const r=await fetch(u,opts); if(r.status===401){ toast("Unauthorized — check access key",true); throw new Error("401"); } return r.json(); }

if(!KEY){ $("keygate").classList.remove("hidden"); }
else {
  (async()=>{
    let role=null;
    try{ role=await (await fetch("/api/role?key="+encodeURIComponent(KEY))).json(); }catch(e){}
    if(role && role.ok){
      CURRENT_USER = role.user || "";
      $("appwrap").classList.remove("hidden");
      $("whoName").textContent = CURRENT_USER;
      if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
      keepFocus(); loadBins();
      // Live freshness: refresh the Bins list / open bin view so changes others save appear automatically.
      setInterval(liveRefresh, 15000);
      document.addEventListener("visibilitychange",()=>{ if(!document.hidden) liveRefresh(); });
    } else {
      try{ localStorage.removeItem("sk_key"); }catch(e){}
      $("keygate").classList.remove("hidden");
      const m=$("gateMsg"); if(m) m.textContent="That username isn't recognized — check spelling and try again.";
    }
  })();
}

/* ---------- tabs ---------- */
function showTab(t){
  for(const x of ["scan","bins","search"]){ $("tab-"+x).classList.toggle("hidden",x!==t); $("nav-"+x).classList.toggle("on",x===t); }
  if(t==="bins") loadBins();
  if(t==="scan") setTimeout(keepFocus,50);
}

/* ---------- keyboard-wedge (scanner gun) ---------- */
// The #scan box stays focused so a scanner gun types into it and its trailing Enter fires a lookup.
function keepFocus(){ const s=$("scan"); if(!s) return; if(document.activeElement!==s && !$("tab-scan").classList.contains("hidden")) s.focus(); }
document.addEventListener("click",(e)=>{ if(e.target.closest("input,button,a")) return; keepFocus(); });
$("scan").addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); submitScan(); } });
async function submitScan(){ const code=$("scan").value.trim(); if(!code)return; $("scan").value="";
  // Multi-word text isn't a barcode/SKU — treat it as a name search.
  if(/\s/.test(code)){ showTab("search"); $("q").value=code; doFind(); return; }
  await lookup(code); }

/* ---------- camera scanning ---------- */
let html5qr=null, camOn=false;
// Start the camera; on a successful scan, run onDetect(code). Used by the main scanner AND the bin "add" box.
async function startCamera(onDetect){
  if(camOn) stopCamera();
  $("reader").style.display="block"; $("camBtn").textContent="✕ Stop camera";
  try{ $("reader").scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){}
  try{
    html5qr = new Html5Qrcode("reader",{ verbose:false });
    await html5qr.start({facingMode:"environment"}, { fps:12, qrbox:{width:260,height:180} },
      (txt)=>{ navigator.vibrate&&navigator.vibrate(60); stopCamera(); onDetect(txt.trim()); },
      ()=>{});
    camOn=true;
  }catch(e){ $("scanNote").textContent="Camera unavailable — use a scanner gun or type the code. ("+e+")"; stopCamera(); }
}
function toggleCamera(){ if(camOn){ stopCamera(); return; } startCamera(lookup); }
function scanIntoBin(bin){ startCamera((code)=>addToBinCode(bin, code)); }
function stopCamera(){ $("camBtn").textContent="📷 Scan with camera"; $("reader").style.display="none";
  if(html5qr){ html5qr.stop().then(()=>html5qr.clear()).catch(()=>{}); } camOn=false; }

/* ---------- lookup / render ---------- */
let lastCode=null;
async function lookup(code){
  lastCode=code;
  $("result").innerHTML='<div class="card center muted">Looking up <span class="mono">'+esc(code)+'</span>…</div>';
  showTab("scan");
  let d; try{ d=await api("/api/resolve?code="+encodeURIComponent(code)); }catch(e){ return; }
  if(d.type==="item") renderItem(d);
  else if(d.type==="bin") renderBin(d);
  else if(d.type==="unknown") renderUnknown(d);
  else $("result").innerHTML='<div class="card center muted">Nothing scanned.</div>';
}
function storesRows(stores){
  if(!stores||!stores.length) return '<tr><td class="muted" colspan="3">Not found in any store</td></tr>';
  return stores.map(s=>`<tr><td>${esc(s.brand)}</td><td class="muted">${esc(s.status||"")}</td><td class="n"><b>${s.qty==null?"—":s.qty}</b></td></tr>`).join("");
}
function histRows(h){
  if(!h||!h.length) return '<div class="muted">No location history yet.</div>';
  return h.map(x=>`<div class="h"><span>${x.from_bin?`<span class="mono">${esc(x.from_bin)}</span>`:'<span class="muted">—</span>'} <span class="arrow">→</span> <span class="mono">${esc(x.to_bin||"—")}</span></span><span class="muted">${esc(x.user_name||"")} · ${fmt(x.ts)}</span></div>`).join("");
}
function fmt(ts){ try{ return new Date(ts).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ts; } }
function renderItem(d){
  currentView=null; // item views aren't auto-refreshed (avoids clobbering a move in progress)
  const binPill = d.current_bin ? `<span class="pill bin">📍 ${esc(d.current_bin)}</span>` : `<span class="pill nobin">no bin set</span>`;
  $("result").innerHTML=`
    <div class="card">
      <div class="itemhead">
        ${d.image?`<img src="${esc(d.image)}" alt="">`:`<div style="width:64px;height:64px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">📦</div>`}
        <div style="flex:1;min-width:0">
          <p class="title">${esc(d.title||d.sku)}</p>
          <div class="sub mono">SKU ${esc(d.sku||"—")}${d.barcode?` · UPC ${esc(d.barcode)}`:""}</div>
          <div style="margin-top:6px">${binPill}</div>
        </div>
      </div>
      <div class="qtygrid"><div class="k" style="align-self:end">On hand (all stores)</div><div class="big">${d.total_qty==null?"—":d.total_qty}</div></div>
      <table style="margin-top:10px"><thead><tr><th>Store</th><th>Status</th><th class="n">Qty</th></tr></thead><tbody>${storesRows(d.stores)}</tbody></table>
    </div>
    <div class="card">
      <div class="sectlabel" style="margin-top:0">Set / move bin</div>
      <div class="moverow">
        <input id="moveBin" placeholder="Scan or type bin (e.g. A-01-3)" autocomplete="off" value="${esc(d.current_bin||"")}">
        <button class="btn" onclick="doMove('${esc(d.sku)}')">Save</button>
      </div>
      <div class="moverow"><input id="moveNote" placeholder="Note (optional)" autocomplete="off"><input id="moveQty" inputmode="numeric" placeholder="Qty seen (optional)" style="max-width:130px"></div>
      <div class="note">Saving updates the app + pushes the location to ShipStation.</div>
    </div>
    <div class="card">
      <div class="sectlabel" style="margin-top:0">Location history</div>
      <div class="hist" id="histbox">${histRows(d.history)}</div>
    </div>`;
}
function renderBin(d){
  currentView={kind:"bin",key:d.bin}; // keep this bin view live
  const b=esc(d.bin);
  const rows = (d.items&&d.items.length)? d.items.map(it=>`<tr>
      <td onclick="lookup('${esc(it.sku)}')" style="cursor:pointer"><div class="mono">${esc(it.sku)}</div><div class="muted" style="font-size:12px">${esc(it.title||"")}</div></td>
      <td class="n"><button class="btn ghost" style="padding:6px 12px" onclick="removeFromBin('${esc(it.sku)}','${b}')">Remove</button></td>
    </tr>`).join("")
    : '<tr><td colspan="2" class="muted">No items in this bin yet — add one below.</td></tr>';
  $("result").innerHTML=`
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="pill bin" style="font-size:15px">🗄️ ${b}</span>
        <div class="sub" style="flex:1">${(d.items?d.items.length:0)} item${(d.items&&d.items.length===1)?"":"s"}</div>
        <button class="btn sec" onclick="printLabel('${b}','${esc(d.label||"")}')">🖨️ Label</button>
      </div>
      <div class="sectlabel" style="margin-top:12px">Add an item to this bin</div>
      <div class="moverow">
        <input id="binAdd" placeholder="Scan or type SKU / UPC" autocomplete="off" autocapitalize="off"
          onkeydown="if(event.key==='Enter')addToBin('${b}')">
        <button class="btn blue" onclick="scanIntoBin('${b}')" title="Scan with camera">📷</button>
        <button class="btn" onclick="addToBin('${b}')">Add</button>
      </div>
      <table style="margin-top:14px"><thead><tr><th>Item</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}
function reloadBin(bin){ api("/api/bin/"+encodeURIComponent(bin)).then(d=>{ if(d&&!d.error) renderBin(d); }).catch(()=>{}); }
function addToBin(bin){ const code=$("binAdd")?$("binAdd").value.trim():""; if(code)$("binAdd").value=""; addToBinCode(bin, code); }
async function addToBinCode(bin, code){
  code=(code||"").trim(); if(!code) return;
  // resolve the scanned/typed code to a SKU (handles UPC or SKU)
  let sku=code;
  try{ const r=await api("/api/resolve?code="+encodeURIComponent(code));
    if(r.type==="item"&&r.sku){ sku=r.sku; } else { toast("Not a known item: "+code,true); return; }
  }catch(e){ return; }
  try{ const r=await api("/api/move",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:KEY,sku,addBin:bin})});
    if(r.error){ toast(r.error,true); return; }
    toast(`Added ${sku} → ${bin}${r.shipstation&&r.shipstation.pushed?" · SS ✓":""}`, !!(r.shipstation&&r.shipstation.error));
    reloadBin(bin);
  }catch(e){ toast("Add failed",true); }
}
async function removeFromBin(sku,bin){
  try{ const r=await api("/api/move",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:KEY,sku,removeBin:bin})});
    if(r.error){ toast(r.error,true); return; }
    toast(`Removed ${sku} from ${bin}${r.shipstation&&r.shipstation.pushed?" · SS ✓":""}`, !!(r.shipstation&&r.shipstation.error));
    reloadBin(bin);
  }catch(e){ toast("Remove failed",true); }
}
function renderUnknown(d){
  currentView=null;
  $("result").innerHTML=`<div class="card center">
    <p class="title">Unknown code</p>
    <div class="sub mono">${esc(d.code)}</div>
    <p class="muted">Not found as a SKU, barcode, or bin. If this is a SKU, you can still assign it a bin below.</p>
    <div class="moverow"><input id="moveBin" placeholder="Bin code" autocomplete="off"><button class="btn" onclick="doMove('${esc(d.code)}')">Assign</button></div>
  </div>`;
}
async function doMove(sku){
  const bin=$("moveBin").value.trim(); if(!bin){ toast("Enter a bin",true); return; }
  const note=($("moveNote")&&$("moveNote").value.trim())||""; const qty=($("moveQty")&&$("moveQty").value.trim())||"";
  try{
    const r=await api("/api/move",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:KEY,sku,toBin:bin,user:whoName(),note,qtySeen:qty?Number(qty):null})});
    if(r.error){ toast(r.error,true); return; }
    let msg=`Saved → ${bin}`; if(r.shipstation&&r.shipstation.pushed) msg+=" · ShipStation ✓"; else if(r.shipstation&&r.shipstation.error) msg+=" · ShipStation ✕";
    toast(msg, !!(r.shipstation&&r.shipstation.error));
    lookup(sku);
  }catch(e){ toast("Save failed",true); }
}

/* ---------- live + manual refresh ---------- */
// Silent background refresh of whatever shared view is open.
function liveRefresh(){
  if(document.hidden) return;
  const ae=document.activeElement;
  if(ae && ae.closest && ae.closest("#result")) return; // don't clobber someone typing in the open view
  if(!$("tab-bins").classList.contains("hidden")){ loadBins(); return; }
  if(!$("tab-scan").classList.contains("hidden") && currentView && currentView.kind==="bin"){ reloadBin(currentView.key); }
}
// The Refresh button: reload whatever the user is currently looking at, with feedback.
function refreshNow(){
  const b=$("refreshBtn"); if(b){ b.classList.add("spin"); setTimeout(()=>b.classList.remove("spin"),700); }
  if(!$("tab-bins").classList.contains("hidden")){ loadBins(); }
  else if(!$("tab-search").classList.contains("hidden")){ doFind(); }
  else if(currentView && currentView.kind==="bin"){ api("/api/bin/"+encodeURIComponent(currentView.key)).then(d=>{ if(d && !d.error) renderBin(d); }).catch(()=>{}); }
  else if(lastCode){ lookup(lastCode); }
  toast("Refreshed");
}

/* ---------- bins tab ---------- */
async function loadBins(){
  try{ const d=await api("/api/bins"); const el=$("binlist");
    if(!d.bins||!d.bins.length){ el.innerHTML='<div class="muted center">No bins yet. Add one above.</div>'; return; }
    el.innerHTML=d.bins.map(b=>`<a onclick="lookup('BIN-${esc(b.code)}');showTab('scan')"><span><span class="mono">${esc(b.code)}</span> <span class="muted">${esc(b.label&&b.label!==b.code?b.label:"")}</span></span><span class="muted">${b.items} item${b.items===1?"":"s"} ›</span></a>`).join("");
  }catch(e){}
}
async function addBin(){ const code=$("newBin").value.trim(); if(!code)return; try{ await api("/api/bins",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:KEY,code})}); $("newBin").value=""; toast("Bin added"); loadBins(); }catch(e){} }
async function syncSS(){ const b=$("syncBtn"); const old=b.textContent; b.textContent="⏳ Importing…"; b.disabled=true;
  try{ const r=await api("/api/sync-shipstation",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:KEY})});
    if(r.error){ toast(r.error,true); } else { toast(`Imported ${r.imported} + updated ${r.updated} (${r.with_location} located)`); loadBins(); }
  }catch(e){ toast("Import failed",true); } finally{ b.textContent=old; b.disabled=false; } }

/* ---------- search tab: product NAME / SKU search across all stores, with filters + sort ---------- */
let searchT=null, findItems=[];
function toggleChip(el){ el.classList.toggle("on"); renderFind(); }
function doFind(){ clearTimeout(searchT); searchT=setTimeout(async()=>{
  const q=$("q").value.trim();
  if(q.length<2){ findItems=[]; $("searchres").innerHTML='<div class="muted center">Type a product name or SKU to search all stores.</div>'; return; }
  $("searchres").innerHTML='<div class="muted center">Searching…</div>';
  try{ const d=await api("/api/find?q="+encodeURIComponent(q)); findItems=d.items||[]; renderFind(); }
  catch(e){ $("searchres").innerHTML='<div class="muted center">Search error.</div>'; }
},300); }
function binKey(b){ return b? String(b).toLowerCase() : null; }
function renderFind(){
  if(!findItems.length){ const q=$("q").value.trim(); $("searchres").innerHTML='<div class="muted center">'+(q.length<2?"Type a product name or SKU to search all stores.":"No products match.")+'</div>'; return; }
  // status filter (chips); if none selected, show all
  const sel=[...document.querySelectorAll(".chip.on")].map(c=>c.dataset.st);
  let rows = sel.length ? findItems.filter(it=> sel.includes(String(it.status||"").toUpperCase())) : findItems.slice();
  // sort
  const s=$("sort").value;
  rows.sort((a,b)=>{
    if(s==="qty_desc") return (b.qty??-1)-(a.qty??-1);
    if(s==="qty_asc")  return (a.qty??Infinity)-(b.qty??Infinity);
    // bin sorts — items without a bin always go last
    const ka=binKey(a.bin), kb=binKey(b.bin);
    if(ka===null&&kb===null) return 0; if(ka===null) return 1; if(kb===null) return -1;
    const cmp = ka.localeCompare(kb, undefined, {numeric:true, sensitivity:"base"});
    return s==="bin_desc" ? -cmp : cmp;
  });
  if(!rows.length){ $("searchres").innerHTML='<div class="muted center">No results match the current filters.</div>'; return; }
  const total=findItems.length;
  $("searchres").innerHTML='<div class="muted" style="margin-bottom:8px">'+rows.length+' of '+total+' shown</div>'+
    '<table><thead><tr><th>Item</th><th class="n">Qty</th><th>Bin</th></tr></thead><tbody>'+
    rows.map(it=>`<tr onclick="lookup('${esc(it.sku||"")}')" style="cursor:pointer">
      <td><div>${esc(it.title||"")}</div><div class="muted" style="font-size:12px">${esc(it.brand)} · <span class="mono">${esc(it.sku||"—")}</span>${it.status&&String(it.status).toUpperCase()!=="ACTIVE"?` · ${esc(String(it.status).toLowerCase()==="archived"?"inactive":String(it.status).toLowerCase())}`:""}</div></td>
      <td class="n"><b>${it.qty==null?"—":it.qty}</b></td>
      <td>${it.bin?`<span class="mono">${esc(it.bin)}</span>`:'<span class="muted">—</span>'}</td></tr>`).join("")+
    '</tbody></table>';
}

/* ---------- print bin label (QR encodes BIN-<code>) ---------- */
function printLabel(code,label){
  const pa=$("printArea"); pa.innerHTML=`<div style="text-align:center;font-family:sans-serif">
    <div id="qrbox" style="display:inline-block;margin:20px auto"></div>
    <div style="font-size:40px;font-weight:800;font-family:monospace;letter-spacing:2px">${esc(code)}</div>
    <div style="font-size:20px;color:#333;margin-top:6px">${esc(label||"")}</div>
    <div style="font-size:13px;color:#888;margin-top:10px">Brusche Stockroom</div></div>`;
  pa.style.display="block";
  $("qrbox").innerHTML=""; new QRCode($("qrbox"),{ text:"BIN-"+code, width:220, height:220, correctLevel:QRCode.CorrectLevel.M });
  setTimeout(()=>{ window.print(); pa.style.display="none"; }, 300);
}
</script>
